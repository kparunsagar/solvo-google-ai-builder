# Google Cloud Build Pipeline for Urban Daily (MyUrbanDaily)
# Deploys backend serverless container to Google Cloud Run in asia-south1 (Mumbai)
# Zero-Cost Architecture: Scale-to-Zero, 2,000,000 free requests/mo

steps:
  # 1. Build Production Multi-Stage Container Image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/urbanai-backend:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/urbanai-backend:latest'
      - './backend'
    id: 'build-container'

  # 2. Push Container to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/urbanai-backend:$COMMIT_SHA'
    id: 'push-sha-image'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/urbanai-backend:latest'
    id: 'push-latest-image'

  # 3. Deploy Serverless Container to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'urbanai-backend'
      - '--image'
      - 'gcr.io/$PROJECT_ID/urbanai-backend:$COMMIT_SHA'
      - '--region'
      - 'asia-south1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      - '--concurrency'
      - '80'
      - '--cpu'
      - '1'
      - '--memory'
      - '512Mi'
      - '--port'
      - '5000'
      - '--set-env-vars'
      - 'NODE_ENV=production,CLOUD_RUN_REGION=asia-south1'
    id: 'deploy-cloud-run'

images:
  - 'gcr.io/$PROJECT_ID/urbanai-backend:latest'
  - 'gcr.io/$PROJECT_ID/urbanai-backend:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
