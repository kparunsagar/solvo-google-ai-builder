apiVersion: v1
kind: ConfigMap
metadata:
  name: sagara-backend-config
  namespace: application
data:
  PORT: "5000"
  NODE_ENV: "production"
  SAGARA_LAT: "14.1670"
  SAGARA_LNG: "75.0298"
  DEFAULT_RADIUS_KM: "15"
  COMMISSION_RATE: "0.15"
  GST_RATE: "0.18"
---
apiVersion: v1
kind: Secret
metadata:
  name: sagara-backend-secrets
  namespace: application
type: Opaque
stringData:
  JWT_SECRET: "REPLACE_WITH_BASE64_ENCODED_JWT_SECRET"
  PAYMENT_WEBHOOK_SECRET: "REPLACE_WITH_BASE64_ENCODED_RAZORPAY_WEBHOOK_SECRET"
  DATABASE_URL: "postgresql://app_user:REPLACE_WITH_DB_PASSWORD@postgres-service.data.svc.cluster.local:5432/marketplace"
  REDIS_URL: "redis://:REPLACE_WITH_REDIS_PASSWORD@redis-service.data.svc.cluster.local:6379"
