name: UrbanAI CI/CD Pipeline

on:
  push:
    branches:
      - main
      - release/*
  workflow_dispatch:
    inputs:
      trigger_reason:
        description: 'Reason for manual build'
        required: false
        default: 'Manual pipeline run for APK/AAB & Web deploy'
  pull_request:
    branches:
      - main

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: 'true'

jobs:

  # ==========================================
  # 1. QUALITY ASSURANCE & TESTING
  # ==========================================
  test-and-lint:
    name: Unit & Integration Tests (TypeScript & Python)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Node.js
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      # Python
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: services/tracking-service/requirements.txt

      # Backend Test
      - name: Install & Test Core Backend
        working-directory: ./backend
        run: |
          npm ci
          npm test

      # Frontend Build
      - name: Install & Build Frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

      # Python Tracking Service
      - name: Install Python Tracking Dependencies
        working-directory: ./services/tracking-service
        run: |
          pip install -r requirements.txt
          python -c "import main; print('Tracking service compiled successfully')"


  # ==========================================
  # 2. DEVSECOPS SECURITY AUDIT
  # ==========================================
  security-audit:
    name: Security Vulnerability Audit (Trivy)
    runs-on: ubuntu-latest
    needs: test-and-lint
    continue-on-error: true

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          ignore-unfixed: true
          format: table
          severity: CRITICAL,HIGH
          exit-code: '0'


  # ==========================================
  # 3. DOCKER BUILD & PUSH
  # ==========================================
  build-and-push-dockerhub:
    name: Build & Push Images to Docker Hub
    runs-on: ubuntu-latest
    needs: test-and-lint
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Docker Hub Credentials
        id: check_docker_creds
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ] || [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "::notice title=Docker Hub Skipped::DOCKERHUB_USERNAME / DOCKERHUB_TOKEN secrets are not configured in GitHub repository. Docker Hub push skipped cleanly."
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        if: steps.check_docker_creds.outputs.configured == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.check_docker_creds.outputs.configured == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Frontend Image
        if: steps.check_docker_creds.outputs.configured == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/urbanai-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/urbanai-frontend:${{ github.sha }}

      - name: Build & Push Backend API Image
        if: steps.check_docker_creds.outputs.configured == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/urbanai-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/urbanai-backend:${{ github.sha }}

      - name: Build & Push Bike Tracking Image
        if: steps.check_docker_creds.outputs.configured == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./services/tracking-service
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/urbanai-tracking:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/urbanai-tracking:${{ github.sha }}


  # ==========================================
  # 4. FIREBASE HOSTING DEPLOYMENT (FREE TIER)
  # ==========================================
  deploy-firebase-hosting:
    name: Deploy to Firebase Free Tier Hosting
    runs-on: ubuntu-latest
    needs: test-and-lint
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Build Frontend for Firebase
        working-directory: ./frontend
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_PROJECT_ID: 'myurbandaily-458d0'
          VITE_FIREBASE_AUTH_DOMAIN: 'myurbandaily.firebaseapp.com'
          VITE_RAZORPAY_KEY_ID: ${{ secrets.VITE_RAZORPAY_KEY_ID }}
        run: |
          npm ci
          npm run build

      - name: Deploy to Firebase Hosting (Action)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_MYURBANDAILY_458D0 }}'
          channelId: live
          projectId: myurbandaily-458d0
          target: myurbandaily
        continue-on-error: true

      - name: Deploy to Firebase Hosting (Direct Service Account)
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MYURBANDAILY_458D0 }}
        run: |
          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "$FIREBASE_SERVICE_ACCOUNT" > sa.json
            export GOOGLE_APPLICATION_CREDENTIALS=$(pwd)/sa.json
            npx --yes firebase-tools deploy --only hosting:myurbandaily --project myurbandaily-458d0 --non-interactive || true
            rm -f sa.json
          fi


  # ==========================================
  # 5. GOOGLE PLAY STORE ANDROID BUILD & APK PACKAGING
  # ==========================================
  build-and-release-android:
    name: Build & Package Android App (APK & Play Store AAB)
    runs-on: ubuntu-latest
    needs: test-and-lint
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configure Android SDK Licenses
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          mkdir -p /usr/local/lib/android/sdk/licenses || true
          printf "24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n" > /usr/local/lib/android/sdk/licenses/android-sdk-license
          printf "84831b9409646a918e30573bab4c9c91346d8abd\n" > /usr/local/lib/android/sdk/licenses/android-sdk-preview-license

      - name: Build Web Production Assets & Sync Capacitor
        working-directory: ./frontend
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_PROJECT_ID: 'myurbandaily-458d0'
          VITE_FIREBASE_AUTH_DOMAIN: 'myurbandaily.firebaseapp.com'
          VITE_RAZORPAY_KEY_ID: ${{ secrets.VITE_RAZORPAY_KEY_ID }}
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Configure Keystore and Play Store Credentials
        id: configure_signing
        working-directory: ./frontend/android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PLAY_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/release.keystore
            echo "keystore_ready=true" >> $GITHUB_OUTPUT
            echo "KEYSTORE_PATH=$(pwd)/app/release.keystore" >> $GITHUB_ENV
          else
            echo "keystore_ready=false" >> $GITHUB_OUTPUT
            echo "::notice title=Direct APK & Unsigned Bundle::ANDROID_KEYSTORE_BASE64 secret not set. Building standalone APK & unsigned release bundle."
          fi

          if [ -n "$PLAY_JSON" ]; then
            echo "play_ready=true" >> $GITHUB_OUTPUT
          else
            echo "play_ready=false" >> $GITHUB_OUTPUT
            echo "::notice title=Play Store Publish Skipped::GOOGLE_PLAY_SERVICE_ACCOUNT_JSON secret not set. Google Play upload skipped."
          fi

      - name: Compile Android App Bundle (.aab) & Direct Install APK (.apk)
        working-directory: ./frontend/android
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug bundleRelease --stacktrace

      - name: Archive Android App Bundle & APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: myurbandaily-android-packages
          path: |
            frontend/android/app/build/outputs/apk/debug/*.apk
            frontend/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn

      - name: Publish to Google Play Store (Internal Track)
        if: steps.configure_signing.outputs.keystore_ready == 'true' && steps.configure_signing.outputs.play_ready == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.myurbandaily.app
          releaseFiles: frontend/android/app/build/outputs/bundle/release/*.aab
          track: internal
          status: completed
